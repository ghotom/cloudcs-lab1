name: California Housing Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi==0.109.2 starlette==0.36.3 httpx==0.24.1 pytest==7.2.1 scikit-learn==1.2.1 pandas==2.1.0 numpy==1.25.0 seaborn==0.12.2
        pip install pycodestyle

    - name: Run tests
      run: |
        export PYTHONPATH=./:./src
        pytest test